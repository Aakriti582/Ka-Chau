name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: kachau
          POSTGRES_USER: kachau
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        # Without this, the job starts before Postgres accepts connections
        # and Django fails on a race rather than a real problem.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-not-used-anywhere
      DEBUG: "False"
      DATABASE_URL: postgis://kachau:ci-password@localhost:5432/kachau
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # GeoDjango needs these on the runner, same as on your machine.
      - name: Install GDAL and GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check
        run: python manage.py check

      - name: Migrations are not missing
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test proximity

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build